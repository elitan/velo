name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run typecheck
      run: bun run typecheck

  test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run tests
      run: bun run test

    - name: Build web UI
      run: bun run web:build

    - name: Check shell scripts
      run: bash -n scripts/*.sh

    - name: Check install guide smoke commands
      run: |
        grep -E "ExecStartPre=.*scripts/update.sh --pre-start" install.md
        grep -F "/healthz" install.md
        grep -F "/api/v1/dashboard/retrieve" install.md
        ! grep -E "app-auth-service|project-service|saveAppPassword|saveProject" install.md

    - name: Test release artifact
      run: scripts/test-release-artifact.sh

    - name: Test update flow
      run: scripts/test-update-flow.sh

  hetzner-e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ typecheck, test ]
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Configure SSH key
      env:
        HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      run: |
        test -n "$HETZNER_SSH_KEY"
        install -m 700 -d "$RUNNER_TEMP/ssh"
        printf '%s\n' "$HETZNER_SSH_KEY" > "$RUNNER_TEMP/ssh/hetzner_key"
        chmod 600 "$RUNNER_TEMP/ssh/hetzner_key"

    - name: Run Hetzner E2E
      env:
        HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        VELO_DEPLOY_KEY: ${{ runner.temp }}/ssh/hetzner_key
        VELO_REPO: https://github.com/${{ github.repository }}.git
        VELO_REF: ${{ github.sha }}
        VELO_CI_RUN_ID: ${{ github.run_id }}
      run: scripts/ci-hetzner.sh
