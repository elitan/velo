name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run typecheck
      run: bun run typecheck

    - name: Run tests
      run: bun run test

    - name: Build web UI
      run: bun run web:build

    - name: Check shell scripts
      run: bash -n scripts/*.sh

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Configure SSH key
      env:
        HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      run: |
        test -n "$HETZNER_SSH_KEY"
        install -m 700 -d "$RUNNER_TEMP/ssh"
        printf '%s\n' "$HETZNER_SSH_KEY" > "$RUNNER_TEMP/ssh/hetzner_key"
        chmod 600 "$RUNNER_TEMP/ssh/hetzner_key"

    - name: Reset and deploy Hetzner servers
      env:
        VELO_DEPLOY_KEY: ${{ runner.temp }}/ssh/hetzner_key
        VELO_REPO: https://github.com/${{ github.repository }}.git
        VELO_REF: ${{ github.sha }}
      run: scripts/deploy-hetzner.sh
