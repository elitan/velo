name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump type. Must be at least the recommended bump.
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate bump
        id: policy
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases must run from main. Current ref: $GITHUB_REF"
            exit 1
          fi

          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            range="$last_tag..HEAD"
          else
            range="HEAD"
          fi

          git log --pretty=format:'%s' --no-merges "$range" \
            | grep -Ev '^chore\(release\): (bump version to|revert .*version bump|revert .*release bump)' \
            > commits.txt || true
          if [ ! -s commits.txt ]; then
            echo "No commits since last release."
            exit 1
          fi

          recommended="patch"
          if grep -Eq '^[a-z]+(\([^)]+\))?!:|BREAKING CHANGE' commits.txt; then
            recommended="major"
          elif grep -Eq '^feat(\(|:)' commits.txt; then
            recommended="minor"
          fi

          selected="${{ inputs.version }}"
          rank_patch=0
          rank_minor=1
          rank_major=2
          selected_rank_var="rank_$selected"
          recommended_rank_var="rank_$recommended"
          selected_rank="${!selected_rank_var}"
          recommended_rank="${!recommended_rank_var}"

          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          echo "recommended=$recommended" >> "$GITHUB_OUTPUT"

          if [ "$selected_rank" -lt "$recommended_rank" ]; then
            echo "Selected bump '$selected' is lower than recommended '$recommended'."
            echo "Commits:"
            git log --pretty=format:'- %h %s' --no-merges "$range"
            exit 1
          fi

          echo "Recommended bump: $recommended"

      - name: Calculate version
        id: version
        run: |
          set -euo pipefail
          current="$(jq -r .version package.json)"
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.version }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac
          echo "value=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Validate release target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "Tag v$version already exists."
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists."
            exit 1
          fi

      - name: Bump package version
        run: |
          set -euo pipefail
          jq '.version = "${{ steps.version.outputs.value }}"' package.json > package.tmp
          mv package.tmp package.json

      - name: Generate release notes
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          VELO_LAST_TAG="${{ steps.policy.outputs.last_tag }}" scripts/generate-release-notes.sh "$version" release_notes.md HEAD
          cat release_notes.md

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        env:
          VELO_UPGRADE_TARGET_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          bun run typecheck
          bun run test
          bun run web:build
          bash -n scripts/*.sh
          scripts/test-release-artifact.sh
          scripts/test-update-flow.sh
          scripts/test-packaged-update-flow.sh
          scripts/test-release-upgrade-flow.sh

      - name: Create release tarball
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          scripts/create-release-tarball.sh "$version" "velo-v$version.tar.gz"

      - name: Smoke test tarball
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          mkdir -p /tmp/velo-smoke
          tar -xzf "velo-v$version.tar.gz" -C /tmp/velo-smoke
          cd /tmp/velo-smoke
          bun install --production --frozen-lockfile
          VELO_DB=/tmp/velo-smoke/.velo/velo.sqlite bun run db:migrate
          test -f dist/server/server.js
          test -d dist/client
          test -f dist/server/assets/migrations/001_initial.sql
          test -f scripts/update.sh

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: velo-v${{ steps.version.outputs.value }}
          path: |
            velo-v${{ steps.version.outputs.value }}.tar.gz
            release_notes.md

      - name: Commit version bump
        run: |
          set -euo pipefail
          git add package.json
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.value }}"
          git push

      - name: Tag release
        run: |
          set -euo pipefail
          git tag "v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          gh release create "v$version" \
            --title "v$version" \
            --notes-file release_notes.md \
            "velo-v$version.tar.gz"
