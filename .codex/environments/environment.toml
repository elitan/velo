# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "velo"

[setup]
script = '''
set -euo pipefail

source_repo="$(cd "$(git rev-parse --git-common-dir)/.." && pwd -P)"
source_env="$source_repo/.env"

[ -d "$source_repo" ]
[ -f "$source_env" ]

git -C "$source_repo" fetch origin main

if git -C "$source_repo" rev-parse --abbrev-ref HEAD | grep -qx main; then
  git -C "$source_repo" pull --ff-only
fi

bun install

[ -f .env ] || cp "$source_env" .env

if [ "$(git rev-parse --abbrev-ref HEAD)" = "HEAD" ]; then
  worktree_root="$(git rev-parse --show-toplevel)"
  worktree_id="$(basename "$(dirname "$worktree_root")")"
  branch_name="codex/$worktree_id"

  if git show-ref --verify --quiet "refs/heads/$branch_name"; then
    git switch "$branch_name"
  else
    git switch -c "$branch_name" origin/main
  fi
fi
'''

